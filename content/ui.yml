    en: Version history could not be loaded. Please check back shortly.

# ── 문의 양식
contact:
  title:
    ko: 문의
    en: Contact
  lede:
    ko: |-
      사용 중 발생한 문제나 기능 제안을 남겨주세요.
      적어주신 메일 주소로 빠른 시일 내 답변드리겠습니다.
    en: |-
      Report a problem or suggest a feature below.
      A reply will be sent to the address you provide as soon as possible.
  nameLabel:
    ko: 이름
    en: Name
  namePlaceholder:
    ko: 홍길동
    en: Your name
  emailLabel:
    ko: 이메일
    en: Email
  emailPlaceholder:
    ko: name@example.com
    en: name@example.com
  topicLabel:
    ko: 문의 유형
    en: Topic
  topicUsage:
    ko: 사용 방법
    en: How to use it
  topicBug:
    ko: 오류 신고
    en: Bug report
  topicFeature:
    ko: 기능 제안
    en: Feature request
  topicEtc:
    ko: 기타
    en: Something else
  messageLabel:
    ko: 문의 내용
    en: Message
  messagePlaceholder:
    ko: 문제가 발생한 상황과 증상을 함께 적어주시면 확인이 빠릅니다.
    en: Describing the situation and the symptom helps it get looked at faster.
  consentLabel:
    ko: 답변을 위해 이름과 이메일을 수집하는 데 동의합니다.
    en: I agree to my name and email being collected so I can be replied to.
  submit:
    ko: 보내기
    en: Send
  required:
    ko: 필수
    en: Required
  mailFallbackLead:
    ko: 아래 주소로 메일을 보내셔도 됩니다.
    en: You may also write to the address below.
  mailFallbackCta:
    ko: 메일 앱으로 보내기
    en: Open your mail app

