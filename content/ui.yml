# 화면에 공통으로 쓰이는 문구입니다.
#
#   · 항목마다 ko(한국어)와 en(영어)이 나란히 있습니다. 둘 다 채워 주세요.
#   · 값에 따옴표를 붙일 필요가 없습니다. 작은따옴표도 그냥 쓰면 됩니다.
#   · 여러 줄은 아래 example 처럼 |- 을 쓰고 줄을 바꿔 적습니다.
#
#       example:
#         ko: |-
#           첫 줄입니다.
#           둘째 줄입니다.
#
#   · {name} 처럼 중괄호로 감싼 자리는 값이 채워 넣어지는 곳입니다. 지우지 마세요.
#   · 왼쪽 이름(site, home 같은 것)은 화면 코드가 찾는 이름이라 바꾸면 안 됩니다.
#     바꿀 것은 ko / en 오른쪽의 글자뿐입니다.

# ── 사이트 이름과 검색 결과 제목
site:
  title:
    ko: ISO Service
    en: ISO Service
  metaTitle:
    ko: 북적이는 1인 스튜디오 | 이소서비스
    en: A crowded one-person studio | ISO Service
  descriptionItem:
    ko: '{name} — {tagline}'
    en: '{name} — {tagline}'
  descriptionJoin:
    ko: ', '
    en: ' · '
  # 뒤에 덧붙이는 한 문장. 비워 두면 서비스 나열로 끝납니다(줄째 지워도 됩니다).
  descriptionTail:
    ko:
    en:

# ── 화면 낭독기·보조 기술용 설명 (눈에 보이지 않습니다)
a11y:
  skipToContent:
    ko: 본문으로 건너뛰기
    en: Skip to content
  openMenu:
    ko: 메뉴 열기
    en: Open main menu
  closeMenu:
    ko: 메뉴 닫기
    en: Close main menu
  toggleTheme:
    ko: 밝은 화면과 어두운 화면 전환
    en: Toggle light and dark appearance
  switchLanguage:
    ko: 언어 전환
    en: Switch language

# ── 헤더 메뉴
