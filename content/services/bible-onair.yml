# Bible OnAir 의 문구입니다.
#
#   · 항목마다 ko(한국어)와 en(영어)이 나란히 있습니다. 둘 다 채워 주세요.
#   · 두 언어가 같은 값(버전·날짜처럼)은 한 줄로만 적혀 있습니다.
#   · 값에 따옴표를 붙일 필요가 없습니다. 작은따옴표도 그냥 쓰면 됩니다.
#   · 여러 줄은 |- 아래에 줄을 바꿔 적습니다.
#   · `백틱`으로 감싼 부분은 화면에서 키 모양으로 표시됩니다.
#   · releases 는 릴리스 저장소를 못 읽었을 때 쓰는 대비 목록입니다.
#     평소에는 릴리스 저장소의 UPDATE-NOTES 를 읽으므로 여기를 고칠 일은 드뭅니다.
#   · 화면 그림·내려받기 주소 같은 연결 설정은 src/config/services.js 에 있습니다.
#
#   왼쪽 이름(summary, features 같은 것)은 화면 코드가 찾는 이름이라 바꾸면 안 됩니다.
#
#   값을 비우면 빌드가 멈추고 어디가 비었는지 알려줍니다.
#   단, 바로 위에 "↓ 비워 두어도 됩니다" 라고 적힌 항목은 예외입니다.

name: Bible OnAir(바이블온에어)
# ↓ 비워 두어도 됩니다 — 제품명 아래 작은 이름입니다. 비우면 그 줄이 사라집니다.
subName:
  ko: 
  en: 
tagline:
  ko: 쓰기편한 성경 프롬프터
  en: Easy-to-use Bible prompter
metaTagline:
  ko: 예배용 성경 구절 프롬프터
  en: A scripture prompter for worship
summary:
  ko: 찾는 순간 바로 화면으로, 예배의 몰입을 돕는 가장 빠른 성경 프롬프터예요.
  en: Found and on screen in an instant — the fastest scripture prompter for worship
# ↓ 비워 두어도 됩니다 — 홈 카드의 부연 한 줄입니다. 비우면 그 줄이 사라집니다.
summaryDetail:
  ko: 제어 화면과 송출 화면의 이원화로, 성경 구절을 실시간으로 안전하고 빠르게 제공할 수 있어요.
  en: A separate control window and output screen put verses up quickly and safely, live.
description:
  - ko: 예배 중 성경 구절을 빠르게 찾아 띄워야 했던 적 있으신가요?
    en: Ever had to find and put a verse on screen in the middle of a service?
  - ko: |-
      갑작스러운 성경 인용에도 당황하지 마세요.
      Bible OnAir(바이블온에어)는 간단한 조작으로 신속한 구절 송출을 지원해요.
    en: |-
      An unexpected reading need not throw you.
      Bible OnAir sends the passage out in a few keystrokes.
screenshotCaptions:
  - ko: 조작 화면 — 왼쪽에서 구절을 선택하고 오른쪽에서 송출 화면을 미리 봐요.
    en: Control window — select a passage on the left, preview the output on the right.
  - ko: 송출 화면 — 선택한 구절이 출력 화면에 표시돼요.
    en: Output screen — the selected passage as displayed up front.
features:
  - title:
      ko: 손쉬운 송출 화면 설정
      en: Simple output setup
    body:
      ko: 듀얼모니터나 빔프로젝터 등 구절을 송출할 화면을 쉽고 빠르게 설정할 수 있어요.
      en: Choose the display the passage goes to — a second monitor or a projector — in a couple of clicks.
  - title:
      ko: 신속한 구절 선택
      en: Fast passage selection
    body:
      ko: |-
        책, 장, 절을 차례로 선택하여 송출 범위를 신속하게 지정해요.
        단축키(`Ctrl + F`) 검색 기능도 지원해요.
      en: |-
        Select book, chapter and verse in turn to set the range.
        A search shortcut (`Ctrl + F`) is available as well.
  - title:
      ko: 다양한 송출 모드
      en: Several display modes
    body:
      ko: 한 절씩, 여러 절씩 보기, 연속 스크롤 등 다양한 출력 방식을 제공하여 예배 상황에 맞춰 자유롭게 활용할 수 있어요.
      en: One verse, several verses, or continuous scroll — pick whichever suits the moment in the service.
  - title:
      ko: 송출 대기 및 전환
      en: Stage and switch
    body:
      ko: 단축키 하나로 송출 상태와 대기 상태를 빠르게 전환할 수 있어요.
      en: A single key switches between sending the passage out and holding it back.
  - title:
      ko: 즐겨찾기 및 백업
      en: Favourites and backup
    body:
      ko: |-
        자주 사용하는 구절을 즐겨찾기에 등록해 빠르게 꺼내 쓸 수 있어요.
        JSON 파일 형식의 가져오기/내보내기 기능을 통해 목록을 편리하게 백업하고 공유해 보세요.
      en: |-
        Register the passages you use often and recall them instantly.
        Import and export the list as JSON to back it up or share it.
  - title:
      ko: 자동 업데이트
      en: Automatic updates
    body:
      ko: 새로운 기능과 최신 버전을 빠르게 안내하고 자동으로 업데이트해요.
      en: New features and releases are announced and installed automatically.
requirements:
  columns:
    - ko: 무료
      en: Free
    - ko: 유료 (준비 중)
      en: Paid (in preparation)
  rows:
    - label:
        ko: 운영체제
        en: Operating system
      shared:
        ko: Windows 10 이상
        en: Windows 10 or later
    - label:
        ko: 출력 화면
        en: Output display
      shared:
        ko: 빔프로젝터 또는 보조 모니터
        en: A projector or second monitor
    - label:
        ko: 인터넷
        en: Internet
      values:
        - ko: 연결 불필요
          en: Not required
        - ko: 연결 필요
          en: Required
    - label:
        ko: 번역본
        en: Translation
      values:
        - 개역한글
        - 개역개정
faq:
  - q:
      ko: macOS나 리눅스에서도 쓸 수 있나요?
      en: Is there a macOS or Linux build?
    a:
      ko: |-
        현재 Bible OnAir는 Windows 운영체제만 지원하고 있습니다.
        더 많은 환경에서 편리하게 사용하실 수 있도록, 추후 지원 플랫폼 확장을 검토할 예정입니다.
      en: |-
        Bible OnAir currently supports Windows only.
        Support for further platforms is under review.
  - q:
      ko: 설치하려는데 "알 수 없는 앱" 경고가 뜹니다.
      en: Windows shows an "unrecognised app" warning.
    a:
      ko: |-
        안전한 프로그램이니 안심하고 진행하셔도 됩니다.
        초기 배포 버전으로 아직 코드 서명(디지털 인증서) 등록 단계에 있어 Windows가 일시적으로 차단하는 현상입니다.

        [설치 방법]
        경고창 화면에서 [추가 정보]를 클릭한 후, 활성화되는 [실행] 버튼을 누르면 정상적으로 설치가 진행됩니다.
      en: |-
        The program is safe to install.
        This is an early release and code signing is still being registered, so Windows blocks it temporarily.

        [How to install]
        Click [More info] in the warning dialog, then press the [Run anyway] button that appears.
  - q:
      ko: 모니터 목록에 빔프로젝터가 안 보입니다.
      en: My projector is not in the monitor list.
    a:
      ko: |-
        현재 PC의 디스플레이 설정이 '화면 복제' 상태인지 확인해 주세요.
        화면 복제 모드에서는 Windows가 하나의 모니터로만 인식하기 때문에 목록에 나타나지 않습니다.
        바탕화면 우클릭 ➔ [디스플레이 설정] 또는 단축키(Win + P)를 통해 디스플레이 모드를 [확장]으로 변경하시면 정상적으로 인식됩니다.
      en: |-
        Check whether the display setting is set to "Duplicate".
        In duplicate mode Windows sees a single monitor, so the projector does not appear in the list.
        Right-click the desktop ➔ [Display settings], or press Win + P, and switch the mode to [Extend].
releases:
  - version: 1.1.0
    date: '2026-09-15'
    summary:
      ko: 사용자의 개선 요청사항을 반영했습니다.
      en: Changes requested by people using the app.
    details:
      - ko: 설정 탭 동작 방식을 수정하였습니다.
        en: Reworked how the settings tab behaves.
      - ko: 구절 선택 관련 버그를 수정하였습니다.
        en: Fixed bugs in passage selection.
      - ko: 송출 모드(두세절씩)를 자연스럽게 다듬었습니다. 폰트 크기에 따라서 출력되는 구절 수가 더 자연스럽게 조정됩니다.
        en: Smoothed out the multi-verse display mode — the number of verses shown now follows the type size more sensibly.
      - ko: 창 크기에 따른 UI를 개선하여 더 이상 미리보기 창이 과도하게 작게 출력되지 않습니다.
        en: Improved the layout at smaller window sizes, so the preview pane is no longer squeezed.
      - ko: 폰트 크기 종류가 추가되었습니다. '작게'부터 '아주 크게' 까지 총 5단계로 설정할 수 있습니다.
        en: Added more type sizes — five steps, from the smallest to the largest.
  - version: 1.0.0
    date: '2026-09-11'
    summary:
      ko: Bible OnAir가 출시되었습니다.
      en: Bible OnAir has been released.
    details:
      - ko: |-
          무료 버전에 개역한글 번역본을 기본 내장하여,
          인터넷 연결이 불가능한 환경에서도 끊김 없이 안정적으로 동작하도록 했습니다.
        en: |-
          The free version bundles the 개역한글 translation,
          so it runs reliably even where no internet connection is available.
# ↓ 비워 두어도 됩니다 — 릴리스 목록 위의 안내 한 줄입니다. 비우면 그 줄이 사라집니다.
releaseNote:
  ko: |-
    향후 추가되는 새 버전은 홈페이지를 확인할 필요 없이,
    프로그램 내에서 자동으로 안내받고 편리하게 업데이트하실 수 있습니다.
  en: |-
    Later versions need no visit to this page —
    the program announces and installs them for you.
