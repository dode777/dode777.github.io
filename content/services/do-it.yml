# Do-It 의 문구입니다.
#
#   · 항목마다 ko(한국어)와 en(영어)이 나란히 있습니다. 둘 다 채워 주세요.
#   · 두 언어가 같은 값(버전·날짜처럼)은 한 줄로만 적혀 있습니다.
#   · 값에 따옴표를 붙일 필요가 없습니다. 작은따옴표도 그냥 쓰면 됩니다.
#   · 여러 줄은 |- 아래에 줄을 바꿔 적습니다.
#   · `백틱`으로 감싼 부분은 화면에서 키 모양으로 표시됩니다.
#   · releases 는 릴리스 저장소를 못 읽었을 때 쓰는 대비 목록입니다.
#     평소에는 릴리스 저장소의 UPDATE-NOTES 를 읽으므로 여기를 고칠 일은 드뭅니다.
#   · 화면 그림·내려받기 주소 같은 연결 설정은 src/config/services.js 에 있습니다.
#
#   왼쪽 이름(summary, features 같은 것)은 화면 코드가 찾는 이름이라 바꾸면 안 됩니다.

name: Do-It
subName:
  ko: 두잇
  en: Do-It
tagline:
  ko: 손짓으로 챙기는 하루
  en: Your day, one gesture at a time
metaTagline:
  ko: 할 일·복약·고정비 체크 앱
  en: A checklist for tasks, pills and bills
summary:
  ko: 꾹 누르면 끝. 약, 루틴, 고정비를 한 장씩 넘기며 챙기는 앱
  en: Press and hold to finish. Swipe through pills, routines and bills one card at a time
summaryDetail:
  ko: 설치 없이 휴대폰 브라우저에서 열고, 홈 화면에 추가하면 앱처럼 쓸 수 있습니다.
  en: Open it in your phone browser — no install — and add it to the home screen to use it like an app.
description:
  - ko: 매일 먹는 약, 잊기 쉬운 루틴, 달마다 빠져나가는 고정비. 챙길 것은 많은데 체크리스트는 금방 길어집니다.
    en: Daily pills, easy-to-forget routines, monthly bills. There is a lot to keep track of, and checklists grow long fast.
  - ko: |-
      Do-It은 한 화면에 한 가지만 보여줍니다.
      꾹 눌러 완료하고, 위로 넘겨 다음 것을 챙기면 됩니다. 놓친 것을 빨갛게 쌓아 재촉하지 않습니다.
    en: |-
      Do-It shows one thing per screen.
      Press and hold to finish it, then swipe up to the next. Missed items are never piled up in red.
screenshotCaptions:
  - ko: 한 화면에 하나 — 지금 챙길 것만 크게 보입니다.
    en: One thing per screen — only what needs doing now, in large type.
  - ko: 꾹 누르면 완료 — 다시 꾹 누르면 되돌립니다.
    en: Press and hold to finish — hold again to undo.
  - ko: 두 번 탭해서 한 줄로 추가 — "저녁 루테인 1알"처럼 적으면 알아서 나눕니다.
    en: Double-tap to add in one line — it splits time, dose and amount for you.
  - ko: 끌어내리면 오늘 요약 — 주제별 남은 것과 고정비 합계를 한눈에.
    en: Pull down for today’s summary — what is left per topic and your monthly bills.
features:
  - title:
      ko: 꾹 눌러 완료
      en: Press and hold to finish
    body:
      ko: |-
        버튼을 찾을 필요 없이 화면을 꾹 누르면 완료됩니다.
        다시 꾹 누르면 되돌리고, 횟수 목표는 누를 때마다 하나씩 올라갑니다.
      en: |-
        No buttons to hunt for: hold anywhere on the card.
        Hold again to undo; count goals go up by one each time.
  - title:
      ko: 한 줄로 추가
      en: Add in one line
    body:
      ko: 두 번 탭하고 "스쿼트 주 3회", "넷플릭스 매월 25일 17000원"처럼 적으면 시간대·횟수·금액을 알아서 나눠 넣습니다.
      en: Double-tap and type a line — the time, count and amount are filled in for you.
  - title:
      ko: 주제별로 넘겨보기
      en: Swipe by topic
    body:
      ko: |-
        약·영양제, 루틴, 집안일처럼 주제를 나눠 옆으로 넘깁니다.
        같은 주제 안에서는 위아래로 한 장씩 챙깁니다.
      en: |-
        Split things into topics such as pills, routines and chores and swipe sideways between them.
        Within a topic, swipe up card by card.
  - title:
      ko: 간격과 기한
      en: Intervals and deadlines
    body:
      ko: 칫솔 교체처럼 며칠마다 하는 일, 자동차 검사처럼 날짜가 정해진 일도 때가 되면 나타납니다.
      en: Things you do every few days, or by a set date, show up when they are due.
  - title:
      ko: 고정비 한눈에
      en: Bills at a glance
    body:
      ko: |-
        구독·보험·통신비를 분류별로 모아 한 달 합계와 다가오는 결제일을 보여줍니다.
        해지하기로 한 것은 따로 표시합니다.
      en: Subscriptions, insurance and utilities grouped by category, with the monthly total and upcoming payment dates.
  - title:
      ko: 설치 없이 앱처럼
      en: An app without installing
    body:
      ko: |-
        앱스토어를 거치지 않고 브라우저에서 바로 엽니다.
        홈 화면에 추가하면 전체 화면으로 열리고, 한 번 연 뒤에는 인터넷 없이도 열립니다.
      en: |-
        Opens straight in the browser.
        Add it to the home screen to open it full screen, and offline after the first visit.
installTitle:
  ko: 홈 화면에 추가하기
  en: Add to the home screen
installSteps:
  - title:
      ko: 휴대폰에서 열기
      en: Open it on your phone
    body:
      ko: 위의 "웹에서 열기"를 누르거나 doit.isocompany.co.kr 로 들어갑니다. 카카오톡·인스타그램 안에서 열렸다면 오른쪽 아래 메뉴에서 기본 브라우저로 열어주세요.
      en: Tap "Open in browser" above, or go to doit.isocompany.co.kr. If it opened inside a messenger app, switch to the default browser first.
  - title:
      ko: 아이폰 (Safari)
      en: iPhone (Safari)
    body:
      ko: 아래쪽 공유 버튼을 누르고 [홈 화면에 추가]를 고릅니다.
      en: Tap the Share button at the bottom and choose [Add to Home Screen].
  - title:
      ko: 안드로이드 (Chrome · 삼성 인터넷)
      en: Android (Chrome · Samsung Internet)
    body:
      ko: 오른쪽 위 메뉴(⋮)에서 [홈 화면에 추가] 또는 [앱 설치]를 고릅니다.
      en: Open the menu (⋮) at the top right and choose [Add to Home screen] or [Install app].
requirements:
  columns:
    - ko: 무료
      en: Free
  rows:
    - label:
        ko: 기기
        en: Device
      shared:
        ko: 휴대폰 · 태블릿 (데스크톱 미지원)
        en: Phone · tablet (no desktop)
    - label:
        ko: 브라우저
        en: Browser
      shared:
        ko: iOS Safari · Android Chrome · 삼성 인터넷
        en: iOS Safari · Android Chrome · Samsung Internet
    - label:
        ko: 설치
        en: Install
      shared:
        ko: 필요 없음 (홈 화면에 추가 권장)
        en: Not needed (adding to the home screen is recommended)
    - label:
        ko: 인터넷
        en: Internet
      shared:
        ko: 처음 열 때만 필요
        en: Only on first open
faq:
  - q:
      ko: 앱스토어에서 받을 수 있나요?
      en: Is it on the App Store?
    a:
      ko: |-
        지금은 웹앱으로만 제공합니다.
        브라우저에서 열고 홈 화면에 추가하면 앱 아이콘이 생기고, 주소창 없이 앱처럼 열립니다.
      en: |-
        For now it is a web app only.
        Open it in the browser and add it to the home screen to get an icon that opens without the address bar.
  - q:
      ko: 컴퓨터에서도 쓸 수 있나요?
      en: Can I use it on a computer?
    a:
      ko: |-
        Do-It은 꾹 누르기, 두 번 탭, 밀기 같은 손짓으로 쓰는 앱이라 휴대폰과 태블릿만 지원합니다.
        컴퓨터에서 열면 휴대폰으로 옮겨 열 수 있는 QR 코드가 나옵니다.
      en: |-
        Do-It is driven by gestures — hold, double-tap, swipe — so it supports phones and tablets only.
        On a computer it shows a QR code to open it on your phone.
  - q:
      ko: 홈 화면에 추가 메뉴가 보이지 않습니다.
      en: I cannot find "Add to Home Screen".
    a:
      ko: |-
        카카오톡이나 인스타그램 같은 앱 안의 브라우저에서는 이 메뉴가 없습니다.
        아이폰은 Safari, 안드로이드는 Chrome 이나 삼성 인터넷으로 다시 열어주세요.
      en: |-
        Browsers inside apps such as KakaoTalk or Instagram do not offer it.
        Reopen the page in Safari on iPhone, or Chrome / Samsung Internet on Android.
releases:
  - version: 0.1.2
    date: '2026-09-24'
    summary:
      ko: 더 앱처럼 동작하도록 다듬었습니다.
      en: Feels more like an app.
    details:
      - ko: 설정 같은 창이 떠 있을 때 화면이 옆으로 끌려 밀리던 문제를 고쳤습니다.
        en: Fixed panels such as Settings sliding sideways off the screen when dragged.
      - ko: 두 번 탭하거나 두 손가락으로 벌려도 화면이 확대되지 않습니다.
        en: The screen no longer zooms in when you double-tap or pinch.
      - ko: 안내 문구를 길게 눌러도 글자가 선택되지 않습니다. 입력창에서는 그대로 쓸 수 있습니다.
        en: Long-pressing labels no longer selects text. Input fields work as before.
  - version: 0.1.1
    date: '2026-09-24'
    summary:
      ko: 시작 화면을 다듬었습니다.
      en: Polished the opening screen.
    details:
      - ko: 앱을 열 때 나오는 시작 화면을 조금 더 여유 있게 보여줍니다. 탭하면 바로 넘어갑니다.
        en: The opening screen now stays a little longer. Tap to skip it.
      - ko: 시작 화면이 사라진 뒤 화면 아래쪽에 색이 남던 문제를 고쳤습니다.
        en: Fixed a strip of color that could stay at the bottom of the screen after the opening screen.
  - version: 0.1.0
    date: '2026-09-24'
    summary:
      ko: Do-It이 출시되었습니다.
      en: Do-It is out.
    details:
      - ko: 한 화면에 할 일 하나씩 보여줍니다. 꾹 눌러 완료하고, 다시 꾹 누르면 되돌립니다.
        en: One thing on screen at a time. Press and hold to finish it, press again to undo.
      - ko: 두 번 탭해서 한 줄로 추가합니다. 시간대·횟수·금액을 알아서 나눠 넣습니다.
        en: Double-tap and add in one line — the time of day, the count and the amount are split out for you.
      - ko: 구독·보험·통신비 같은 고정비를 분류별로 모아 한 달 합계와 다가오는 결제일을 보여줍니다.
        en: Subscriptions, insurance and phone bills are grouped so you see the monthly total and what is due next.
      - ko: 설치 없이 휴대폰 브라우저에서 열고, 홈 화면에 추가하면 앱처럼 쓸 수 있습니다.
        en: 'No install: open it in a phone browser, add it to the home screen and it behaves like an app.'
releaseNote:
  ko: 새 버전은 따로 설치할 필요 없이, 앱을 다시 열면 자동으로 적용됩니다.
  en: New versions need no install — they apply the next time you open the app.
