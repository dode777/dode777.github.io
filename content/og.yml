# 링크 공유 사진에만 쓰이는 문구입니다.
# (주소를 카카오톡이나 문자로 보냈을 때 뜨는 1200x630 미리보기 그림)
#
#   · 큰 글씨는 줄바꿈 위치가 그림에 그대로 반영됩니다. |- 아래에서
#     끊고 싶은 곳에서 줄을 바꾸세요.
#   · 서비스 한 줄 소개처럼 페이지와 겹치는 문구는 여기에 없습니다.
#     services/<이름>.yml 에서 가져다 쓰므로 한 번만 고치면 됩니다.
#   · 이 파일을 고쳐 커밋하면 그림은 저절로 다시 만들어집니다
#     (Actions 의 Render share images 워크플로).

# 세 그림에 공통으로 들어가는 작은 머리글
eyebrow: ISO SERVICE

# 홈·404·문의 완료가 쓰는 그림
home:
  headline:
    ko: |-
      북적이는
      1인 스튜디오
    en: |-
      A crowded
      one-person studio
  foot:
    ko: isocompany.co.kr
    en: isocompany.co.kr
  # 그림 안 작은 상자의 맨 아랫줄 (서비스별)
  notes:
    bible-onair:
      ko: Windows · 무료
      en: Windows · free
    do-it:
      ko: 웹앱 · 설치 없음
      en: Web app · no install

