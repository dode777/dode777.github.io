# 릴리스 에셋의 누적 다운로드 수를 data/download-stats.csv 에 쌓습니다.
#
# GitHub 는 "지금까지 몇 번" 만 알려주고 기간별 추이는 주지 않습니다.
# 주 한 번 찍어 두면 나중에 두 줄을 빼서 "그 사이에 몇 건" 을 셀 수 있습니다.
# (처음엔 매일이었으나 릴리스 주기에 비해 과해 주 1회로 줄였습니다. 이 저장소는 공개라
#  Actions 사용량이 과금되지는 않지만, 기록 커밋과 실행 이력이 불필요하게 쌓였습니다.)
#
# 값이 하나도 바뀌지 않은 날에는 커밋하지 않습니다.
# 기록이 없는 주는 '변화 없음' 으로 읽으면 됩니다.
name: Track download counts

on:
  schedule:
    # 매주 월요일 03:37 KST (UTC 일요일 18:37). 정각은 실행이 몰려 밀리는 일이 잦아 비켜 두었습니다.
    - cron: '37 18 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: track-downloads
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 의존성이 없는 단일 스크립트라 npm ci 가 필요 없습니다.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: node scripts/track-downloads.mjs
        env:
          # 익명으로도 되지만, 토큰을 붙이면 API 시간당 한도가 넉넉해집니다.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 바뀐 게 있을 때만 커밋
        run: |
          git add -A data
          if git diff --cached --quiet -- data; then
            echo "다운로드 수가 그대로입니다. 커밋하지 않습니다."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Chore: 릴리스 다운로드 수 기록'
          git push
