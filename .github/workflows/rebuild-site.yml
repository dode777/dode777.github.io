# 내용이 바뀌면 사이트를 다시 만들어 docs/ 에 반영합니다.
#
# 한 번에 모두 합니다 — 문구 검사 → 링크 공유 사진 → 사이트 빌드 → 커밋.
# 예전에는 사진과 사이트를 워크플로 둘로 나눠 두었는데, 워크플로가 만든 커밋은
# 다음 워크플로를 부르지 않기 때문에(GitHub 의 무한 반복 방지) 사진이 바뀌어도
# 사이트에 반영되지 않는 일이 있었습니다.
#
# 트리거
#   push                : content/ 의 문구나 화면 코드를 고쳤을 때 (GitHub 웹 편집 포함)
#   repository_dispatch : 릴리스 저장소에서 호출 (릴리스 게시 · 노트 수정 시)
#   workflow_dispatch   : Actions 탭에서 수동 실행
#   schedule            : 위가 모두 실패했을 때를 대비한 안전망 (월 1회)
#
# 여러 파일을 잇달아 고치면 앞선 실행은 취소되고 마지막 것만 끝까지 갑니다.
# 결과가 이전과 같으면 커밋하지 않으므로, 헛도는 날에는 기록이 남지 않습니다.
name: Rebuild site

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'src/**'
      - 'scripts/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
  repository_dispatch:
    types: [update-notes]
  workflow_dispatch:
  schedule:
    # 매월 1일 03:00 KST (UTC 18:00, 전달 말일)
    - cron: '0 18 1 * *'

permissions:
  contents: write

# 잇달아 고칠 때 앞선 실행을 취소합니다. 마지막 상태에서 한 번만 끝까지 갑니다.
concurrency:
  group: rebuild-site
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # npm install 이 아니라 npm ci — 잠금 파일을 그대로 써야 결과가 매번 같습니다.
      # (의존성이 조금이라도 달라지면 내용이 같아도 산출물이 바뀌어 헛커밋이 생깁니다.)
      - run: npm ci

      # 문구부터 봅니다. 여기서 걸리면 사진도 사이트도 만들지 않습니다.
      - run: npm run check:content

      - name: 크롬 찾기
        id: chrome
        run: |
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            path=$(command -v "$candidate" || true)
            if [ -n "$path" ]; then
              echo "path=$path" >> "$GITHUB_OUTPUT"
              echo "크롬: $path"
              exit 0
            fi
          done
          echo "::error::실행기에서 크롬을 찾지 못했습니다."
          exit 1

      # 사이트보다 먼저 만들어야 새 사진이 docs/ 로 복사됩니다.
      - name: 링크 공유 사진 만들기
        run: npm run og
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}

      - run: npm run build

      - name: 바뀐 게 있을 때만 커밋
        run: |
          git add -A docs public/assets/og scripts/og-content.js
          if git diff --cached --quiet; then
            echo "결과가 이전과 같습니다. 커밋하지 않습니다."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Chore: 사이트 다시 만듦 (자동)'
          # 다른 워크플로가 먼저 밀어 넣었을 수 있습니다. 받아서 얹고 다시 시도합니다.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              exit 0
            fi
            echo "밀어 넣기 실패 ($attempt/3). 잠시 뒤 다시 시도합니다."
            sleep 5
          done
          echo "::error::세 번 시도했지만 밀어 넣지 못했습니다."
          exit 1
