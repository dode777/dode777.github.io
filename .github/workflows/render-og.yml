# 링크 공유 사진(주소를 카카오톡·문자로 보냈을 때 뜨는 미리보기 그림) 여섯 장을 다시 만듭니다.
#
# 트리거
#   push              : content/ 의 문구나 그림 원본을 고쳤을 때 저절로
#   workflow_dispatch : Actions 탭에서 "Run workflow" 버튼으로 수동 실행
#
# 만들어진 그림은 public/assets/og/ 에 커밋됩니다. 그 뒤 Rebuild site 가 받아
# docs/ 까지 반영하므로, 사람이 터미널을 열 일은 없습니다.
name: Render share images

on:
  push:
    branches: [main]
    paths:
      - 'content/og.yml'
      - 'content/ui.yml'
      - 'content/services/**'
      - 'scripts/og-*.html'
      - 'scripts/build-og-content.mjs'
      - 'scripts/render-og.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-og
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: 크롬 찾기
        id: chrome
        run: |
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            path=$(command -v "$candidate" || true)
            if [ -n "$path" ]; then
              echo "path=$path" >> "$GITHUB_OUTPUT"
              echo "크롬: $path"
              exit 0
            fi
          done
          echo "::error::실행기에서 크롬을 찾지 못했습니다."
          exit 1

      - name: 그림 만들기
        run: npm run og
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}

      - name: 바뀐 게 있을 때만 커밋
        run: |
          git add -A public/assets/og scripts/og-content.js
          if git diff --cached --quiet; then
            echo "그림이 이전과 같습니다. 커밋하지 않습니다."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Chore: 링크 공유 사진 다시 만듦 (자동)'
          git push
