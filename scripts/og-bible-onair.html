<!doctype html>
<!--
  Bible OnAir 링크 공유 미리보기 이미지(1200x630)의 원본입니다. og-home.html(사이트 기본)과 같은 틀입니다.
  브라우저로 1200x630 캡처해 덮어씁니다.
    이 파일              → public/assets/og/og-bible-onair.png
    이 파일#en           → public/assets/og/og-bible-onair-en.png
-->
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<link rel="stylesheet" href="../public/assets/fonts/pretendard/pretendard.relative.css" />
		<style>
			* { margin: 0; padding: 0; box-sizing: border-box; }
			body {
				width: 1200px; height: 630px; overflow: hidden;
				display: flex; align-items: center; gap: 56px;
				padding: 0 72px;
				background: #fff;
				font-family: 'Pretendard', sans-serif;
				color: #0b0b0b;
				word-break: keep-all;
			}
			body::before {
				content: ''; position: fixed; inset: 0 0 auto 0; height: 14px;
				background: #cce6d0;
			}
			.copy { flex: 1 1 auto; min-width: 0; }
			.eyebrow {
				font-size: 26px; font-weight: 700; letter-spacing: 0.06em;
				color: #14401c; text-transform: uppercase;
			}
			h1 {
				margin: 18px 0 0;
				font-family: 'Pretendard', sans-serif; font-weight: 800;
				font-size: 68px; line-height: 1.18; letter-spacing: -0.03em;
			}
			.product {
				margin-top: 26px; display: inline-flex; align-items: center; gap: 12px;
				padding: 10px 22px; border-radius: 999px;
				background: #f2f2f2; font-size: 28px; font-weight: 700;
			}
			.product span { font-weight: 500; color: #4a4a4a; }
			.foot {
				margin-top: 34px; font-size: 25px; font-weight: 500; color: #616161;
			}
			.shot {
				flex: 0 0 440px;
				border-radius: 20px; overflow: hidden;
				border: 1px solid #e0e0e0;
				box-shadow: 0 26px 60px rgba(0, 0, 0, 0.18);
			}
			.shot img { display: block; width: 100%; }
		</style>
	</head>
	<body>
		<div class="copy">
			<p class="eyebrow" data-og="eyebrow"></p>
			<h1 data-og="services.bible-onair.headline"></h1>
			<p class="product"><span data-og="services.bible-onair.pillName"></span> <span data-og="services.bible-onair.pillTagline"></span></p>
			<p class="foot" data-og="services.bible-onair.foot"></p>
		</div>
		<div class="shot">
			<img src="../public/assets/screenshots/bible-onair-screen.png" alt="" />
		</div>
		<script src="og-content.js"></script>
		<script>
			/* 문구는 content/ 에서 옵니다. 여기서는 자리에 끼워 넣기만 합니다. */
			(function () {
				var lang = location.hash === '#en' ? 'en' : 'ko';
				document.documentElement.lang = lang;
				var data = window.OG[lang];
				document.querySelectorAll('[data-og]').forEach(function (el) {
					var value = el.dataset.og.split('.').reduce(function (o, k) {
						return o == null ? o : o[k];
					}, data);
					el.textContent = '';
					String(value == null ? '' : value).split('\n').forEach(function (line, i) {
						if (i) el.appendChild(document.createElement('br'));
						el.appendChild(document.createTextNode(line));
					});
				});
			})();
		</script>
	</body>
</html>
