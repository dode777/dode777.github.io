<!doctype html>
<!--
  사이트 기본 링크 공유 미리보기 이미지(1200x630)의 원본입니다.
  홈·404·문의 완료처럼 특정 서비스에 속하지 않는 화면이 이 그림을 씁니다.
  브라우저로 1200x630 캡처해 덮어씁니다.
    이 파일              → public/assets/og/og-default.png
    이 파일#en           → public/assets/og/og-default-en.png
  서비스를 늘리면 아래 .card 를 한 장 더 두고 폭을 나눠 주세요.
-->
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<link rel="stylesheet" href="../public/assets/fonts/pretendard/pretendard.relative.css" />
		<style>
			* { margin: 0; padding: 0; box-sizing: border-box; }
			body {
				width: 1200px; height: 630px; overflow: hidden; position: relative;
				display: flex; flex-direction: column; justify-content: center;
				padding: 0 72px;
				background: #fff;
				font-family: 'Pretendard', sans-serif;
				color: #0b0b0b;
				word-break: keep-all;
			}
			/* 위 띠 — 사이트의 기본 강조색 */
			body::before {
				content: ''; position: fixed; inset: 0 0 auto 0; height: 14px;
				background: #cce6d0;
			}
			.eyebrow {
				font-size: 26px; font-weight: 700; letter-spacing: 0.06em;
				color: #14401c; text-transform: uppercase;
			}
			h1 {
				margin: 16px 0 0;
				font-family: 'Pretendard', sans-serif; font-weight: 800;
				font-size: 58px; line-height: 1.18; letter-spacing: -0.03em;
			}
			.cards { display: flex; gap: 24px; margin-top: 34px; }
			.card {
				flex: 1 1 0; min-width: 0;
				padding: 26px 32px; border-radius: 24px; background: #f2f2f2;
			}
			.card b {
				display: block;
				font-family: 'Pretendard', sans-serif; font-weight: 800;
				font-size: 38px; letter-spacing: -0.02em;
			}
			.card i { display: block; margin-top: 10px; font-size: 26px; font-style: normal; }
			.card em {
				display: block; margin-top: 16px; font-size: 22px; font-style: normal;
				font-weight: 500; color: #616161;
			}
			.foot { margin-top: 26px; font-size: 25px; font-weight: 500; color: #616161; }
		</style>
	</head>
	<body>
		<p class="eyebrow" data-og="eyebrow"></p>
		<h1 data-og="home.headline"></h1>

		<div class="cards">
			<div class="card">
				<b data-og="home.cards.0.name"></b>
				<i data-og="home.cards.0.tagline"></i>
				<em data-og="home.cards.0.note"></em>
			</div>
			<div class="card">
				<b data-og="home.cards.1.name"></b>
				<i data-og="home.cards.1.tagline"></i>
				<em data-og="home.cards.1.note"></em>
			</div>
		</div>

		<p class="foot" data-og="home.foot"></p>
		<script src="og-content.js"></script>
		<script>
			/* 문구는 content/ 에서 옵니다. 여기서는 자리에 끼워 넣기만 합니다. */
			(function () {
				var lang = location.hash === '#en' ? 'en' : 'ko';
				document.documentElement.lang = lang;
				var data = window.OG[lang];
				document.querySelectorAll('[data-og]').forEach(function (el) {
					var value = el.dataset.og.split('.').reduce(function (o, k) {
						return o == null ? o : o[k];
					}, data);
					el.textContent = '';
					String(value == null ? '' : value).split('\n').forEach(function (line, i) {
						if (i) el.appendChild(document.createElement('br'));
						el.appendChild(document.createTextNode(line));
					});
				});
			})();
		</script>
	</body>
</html>
