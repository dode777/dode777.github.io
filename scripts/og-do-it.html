<!doctype html>
<!--
  Do-It 링크 공유 미리보기 이미지(1200x630)의 원본입니다. og-image.html(사이트 기본 · Bible OnAir)과 같은 틀입니다.
  브라우저로 1200x630 캡처해 덮어씁니다.
    이 파일              → public/assets/og/og-do-it.png
    이 파일#en           → public/assets/og/og-do-it-en.png
  앱(doit.isocompany.co.kr)도 같은 그림을 씁니다 — Do-It 저장소 public/og.png 로 복사합니다.
-->
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<link rel="stylesheet" href="../public/assets/fonts/pretendard/pretendard.relative.css" />
		<style>
			* { margin: 0; padding: 0; box-sizing: border-box; }
			body {
				width: 1200px; height: 630px; overflow: hidden; position: relative;
				display: flex; align-items: center;
				padding: 0 72px;
				background: #fff;
				font-family: 'Pretendard', sans-serif;
				color: #0b0b0b;
				word-break: keep-all;
			}
			/* 위 띠: 사이트 기본 그림의 연두 대신 앱의 주황(꾹 누르기 번짐 색) */
			body::before {
				content: ''; position: fixed; inset: 0 0 auto 0; height: 14px;
				background: #FFB98F;
			}
			.copy { flex: 1 1 auto; min-width: 0; padding-right: 420px; }
			.eyebrow {
				font-size: 26px; font-weight: 700; letter-spacing: 0.06em;
				color: #8a3d12; text-transform: uppercase;
			}
			h1 {
				margin: 18px 0 0;
				font-family: 'Pretendard', sans-serif; font-weight: 800;
				font-size: 68px; line-height: 1.18; letter-spacing: -0.03em;
			}
			.product {
				margin-top: 26px; display: inline-flex; align-items: center; gap: 12px;
				padding: 10px 22px; border-radius: 999px;
				background: #f2f2f2; font-size: 28px; font-weight: 700;
			}
			.product span { font-weight: 500; color: #4a4a4a; }
			.foot { margin-top: 34px; font-size: 25px; font-weight: 500; color: #616161; }
			/* 휴대폰: 아래로 잘려 나가게 — 첫 화면(주제 이름과 할 일 한 장)이 보이는 만큼만 */
			.phone {
				position: absolute; right: 96px; top: 64px;
				width: 330px; height: 640px;
				border-radius: 46px 46px 0 0; overflow: hidden;
				border: 10px solid #16181d; border-bottom: 0;
				box-shadow: 0 26px 60px rgba(0, 0, 0, 0.22);
				background: #FFB98F;
			}
			.phone img { display: block; width: 100%; }
		</style>
		<script>if (location.hash === '#en') document.documentElement.classList.add('is-en'), document.documentElement.lang = 'en';</script>
	</head>
	<body>
		<div class="copy">
			<p class="eyebrow" data-og="eyebrow"></p>
			<h1 data-og="services.do-it.headline"></h1>
			<p class="product">
				<span style="color:inherit;font-weight:700" data-og="services.do-it.pillName"></span>
				<span data-og="services.do-it.pillTagline"></span>
			</p>
			<p class="foot" data-og="services.do-it.foot"></p>
		</div>
		<div class="phone">
			<img src="../public/assets/screenshots/do-it-feed.png" alt="" />
		</div>
		<script src="og-content.js"></script>
		<script>
			/* 문구는 content/ 에서 옵니다. 여기서는 자리에 끼워 넣기만 합니다. */
			(function () {
				var lang = location.hash === '#en' ? 'en' : 'ko';
				document.documentElement.lang = lang;
				var data = window.OG[lang];
				document.querySelectorAll('[data-og]').forEach(function (el) {
					var value = el.dataset.og.split('.').reduce(function (o, k) {
						return o == null ? o : o[k];
					}, data);
					el.textContent = '';
					String(value == null ? '' : value).split('\n').forEach(function (line, i) {
						if (i) el.appendChild(document.createElement('br'));
						el.appendChild(document.createTextNode(line));
					});
				});
			})();
		</script>
	</body>
</html>
