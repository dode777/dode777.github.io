<!doctype html>
<!--
  링크 공유 미리보기 이미지(1200x630)의 원본입니다.
  고칠 일이 생기면 이 파일을 열어 손보고 브라우저로 1200x630 캡처해
  public/assets/og/og-default.png 를 덮어쓰면 됩니다.
-->
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@700&display=swap"
			rel="stylesheet"
		/>
		<style>
			* { margin: 0; padding: 0; box-sizing: border-box; }
			body {
				width: 1200px; height: 630px; overflow: hidden;
				display: flex; align-items: center; gap: 56px;
				padding: 0 72px;
				background: #fff;
				font-family: 'Noto Sans KR', sans-serif;
				color: #0b0b0b;
				word-break: keep-all;
			}
			body::before {
				content: ''; position: fixed; inset: 0 0 auto 0; height: 14px;
				background: #cce6d0;
			}
			.copy { flex: 1 1 auto; min-width: 0; }
			.eyebrow {
				font-size: 26px; font-weight: 700; letter-spacing: 0.06em;
				color: #14401c; text-transform: uppercase;
			}
			h1 {
				margin: 18px 0 0;
				font-family: 'Noto Serif KR', serif; font-weight: 700;
				font-size: 68px; line-height: 1.18; letter-spacing: -0.03em;
			}
			.product {
				margin-top: 26px; display: inline-flex; align-items: center; gap: 12px;
				padding: 10px 22px; border-radius: 999px;
				background: #f2f2f2; font-size: 28px; font-weight: 700;
			}
			.product span { font-weight: 500; color: #4a4a4a; }
			.foot {
				margin-top: 34px; font-size: 25px; font-weight: 500; color: #616161;
			}
			.shot {
				flex: 0 0 440px;
				border-radius: 20px; overflow: hidden;
				border: 1px solid #e0e0e0;
				box-shadow: 0 26px 60px rgba(0, 0, 0, 0.18);
			}
			.shot img { display: block; width: 100%; }
		</style>
	</head>
	<body>
		<div class="copy">
			<p class="eyebrow">ISO Service</p>
			<h1>예배용<br />성경 자막 프로그램</h1>
			<p class="product">Bible OnAir <span>성경 구절 프롬프터</span></p>
			<p class="foot">Windows 무료 · isocompany.co.kr</p>
		</div>
		<div class="shot">
			<img src="../public/assets/screenshots/bible-onair-screen.png" alt="" />
		</div>
	</body>
</html>
